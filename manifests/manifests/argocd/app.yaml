apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "paymentsapi"
spec:
  destination:
    namespace: paymentsapi
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests/base
    repoURL: https://github.com/alokkulkarni/paymentsapi.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
