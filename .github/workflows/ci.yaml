name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build, Test and push to docker hub
    runs-on: arc-personal-runner-set
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew build sonar --info

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t alokkulkarni/paymentsapi:amd64 \
            .

      - name: Build arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t alokkulkarni/paymentsapi:arm64 \
            .

      - name: Push both images
        run: |
          docker push alokkulkarni/paymentsapi:amd64
          docker push alokkulkarni/paymentsapi:arm64

      - name: Create and push manifest
        run: |
          docker manifest create alokkulkarni/paymentsapi:latest \
            --amend alokkulkarni/paymentsapi:amd64 \
            --amend alokkulkarni/paymentsapi:arm64

          docker manifest push alokkulkarni/paymentsapi:latest
