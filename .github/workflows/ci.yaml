name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build, Test and push to docker hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Build and analyze
        env:
          SONAR_TOKEN: 
          SONAR_HOST_URL: 
        run: ./gradlew build sonar --info

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: 
          password: 

      - name: Build Docker Image
        run: |
          docker build -t alokkulkarni/paymentsapi:latest .

      - name: Push Docker Image
        run: |
          docker push alokkulkarni/paymentsapi:latest
