apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: "paymentsapi"
  description: "payments api to capture local domestic payments"
  annotations:
    github.com/project-slug: alokkulkarni/paymentsapi
    backstage.io/techdocs-ref: dir:.
    sonarqube.org/project-key: alokkulkarni_paymentsapi
    backstage.io/code-coverage: scm-only
    # backstage.io/source-location: ''
    # backstage.io/managed-by-location: ''
    jenkins.io/job-full-name: "paymentsapi"
    argocd/app-name: paymentsapi
    jira/project-key: METRICS # The key of the Jira project to track for this entity, or Comma-separated list of Jira project keys optionally prefixed with the instance name
    jira/components: METRICS # Jira component name separated with a comma. The Roadie Backstage Jira Plugin Jira annotation `/component` is also supported here by default
    jira/token-type: Bearer
    jira/all-issues-jql: # optional, used by EntityJiraQueryCard, this query supports basic templating with the above annotations if present, and information from the user profile. e.g. "assignee = {{ userEmail }} AND label = ({{ label }})"
    jira/incoming-issues-status: Incoming # The name of the status for incoming issues in Jira. Default: New
spec:
  type: service
  lifecycle: experimental
  owner: "group:default/productsandchannel"
  system: alokkulkarni/payments
  providesApis:
    - "api:api/info"
    - "api:api/health"
  providedApis:
    - "paymentsDB"
